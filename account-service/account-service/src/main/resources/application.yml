server:
  port: 0


spring:

  application:
    name: account-service

  config:
    import: optional:configserver:http://localhost:8888


  data:
    mongodb:
      uri: mongodb://localhost:27017/account-db

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents

  endpoint:
    health:
      show-details: always

eureka:

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka


  instance:
    prefer-ip-address: true

resilience4j:

  circuitbreaker:

    instances:

      customerService:

        slidingWindowSize: 5

        minimumNumberOfCalls: 3

        failureRateThreshold: 50


  timelimiter:

    instances:

      customerService:

        timeoutDuration: 2s